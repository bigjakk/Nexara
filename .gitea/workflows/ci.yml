# DORMANT — retained as the record of how CI ran on Gitea Actions.
#
# The Gitea repository became a read-only pull mirror of GitHub on 2026-09-14,
# and Gitea does not fire Actions on a mirror sync, so nothing here runs any
# more. The live workflows are .github/workflows/{ci,release}.yml — edit those.
# Do not treat this file as a second copy to keep in step.

name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

jobs:
  go-ci:
    runs-on: ubuntu-latest

    # The internal/db migration round-trip tests skip themselves unless
    # NEXARA_TEST_DB_URL is set, so without this service they skipped on every
    # push while the package still reported "ok". Migrations are applied
    # automatically against existing user databases on container startup, so a
    # broken one would ship unnoticed.
    #
    # This covers pushes and PRs only. A v* tag does NOT run this workflow —
    # `on: push: branches` does not match a tag ref — so release.yml carries its
    # own copy of this block. Keep the two in sync; dropping it there is what
    # would let an unvalidated migration chain ship.
    #
    # TimescaleDB rather than the stock postgres image: migration 000002 runs
    # CREATE EXTENSION timescaledb, which needs the library preloaded — plain
    # postgres cannot run the chain at all.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: nexara
          POSTGRES_DB: nexara_test
        # -h 127.0.0.1 so the probe tests the TCP listener. The postgres
        # entrypoint runs a temporary server with listen_addresses='' while it
        # executes init scripts, and that server answers on the Unix socket —
        # so a socket-only probe can report ready before TCP is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nexara -d nexara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # act_runner has historically started service containers without gating
      # on their health, so the health-cmd above cannot be relied on here the
      # way it can on GitHub. Without this the Test step can reach pgxpool.New
      # before Postgres listens, which surfaces as a t.Fatalf and a red build
      # rather than a skip. Uses bash's /dev/tcp so it needs no psql client in
      # the job image.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/postgres/5432) 2>/dev/null; then
              echo "postgres accepting connections after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Test
        run: go test -race -count=1 ./...
        env:
          # A throwaway database: the migration tests round-trip the schema all
          # the way up and back down, so this must never address a real one.
          # Addressed as "postgres" (the service label), not localhost: Gitea's
          # act_runner executes the job inside a container on a shared network
          # with the service, so there is no port mapped onto the job's own
          # loopback. The GitHub workflow uses localhost for the opposite reason.
          NEXARA_TEST_DB_URL: postgres://nexara:nexara@postgres:5432/nexara_test?sslmode=disable

      - name: Build unified binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/nexara

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [go-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v5

      - name: Build unified image
        run: |
          docker build \
            --pull \
            -f docker/nexara/Dockerfile \
            -t nexara:ci \
            .
