name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ${{ vars.REGISTRY }}
  OWNER: bigjakk
  REPO: nexara

jobs:
  go-ci:
    runs-on: ubuntu-latest

    # Mirrors the identical block in ci.yml, and is required here rather than
    # inherited from it: ci.yml triggers on `push: branches`, which neither
    # GitHub nor Gitea matches for a tag push, and this workflow does not depend
    # on it. Without this service a `v*` tag — the entire release procedure, per
    # CLAUDE.md — runs the migration tests as silent skips while the package
    # still reports "ok", satisfies `needs: [go-ci, ...]`, and ships an image
    # whose migration chain then runs unvalidated against every existing user
    # database on container startup. That is the release path, so it matters
    # more here than in ci.yml.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: nexara
          POSTGRES_DB: nexara_test
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nexara -d nexara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      # act_runner has historically started service containers without gating
      # on their health, so the health-cmd above cannot be relied on here the
      # way it can on GitHub. Without this the Test step can reach pgxpool.New
      # before Postgres listens, which surfaces as a t.Fatalf and a red build
      # rather than a skip. Uses bash's /dev/tcp so it needs no psql client in
      # the job image.
      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if (echo > /dev/tcp/postgres/5432) 2>/dev/null; then
              echo "postgres accepting connections after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "postgres never became reachable"; exit 1

      - name: Test
        run: go test -race -count=1 ./...
        env:
          NEXARA_TEST_DB_URL: postgres://nexara:nexara@postgres:5432/nexara_test?sslmode=disable

      - name: Build unified binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/nexara

  frontend-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  release:
    runs-on: ubuntu-latest
    needs: [go-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          COMMIT=$(git rev-parse --short HEAD)
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Login to container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} \
            -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.OWNER }}/nexara"
          docker build \
            --pull \
            -f docker/nexara/Dockerfile \
            --build-arg "VERSION=${{ steps.version.outputs.version }}" \
            --build-arg "COMMIT=${{ steps.version.outputs.commit }}" \
            --build-arg "BUILD_TIME=${{ steps.version.outputs.build_time }}" \
            --label "org.opencontainers.image.source=https://${{ env.REGISTRY }}/${{ env.OWNER }}/nexara" \
            --label "org.opencontainers.image.description=Nexara - Proxmox management platform" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            -t "${IMAGE}:${{ steps.version.outputs.version }}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${{ steps.version.outputs.version }}"
          docker push "${IMAGE}:latest"

      - name: Link package to repository
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            "https://${{ env.REGISTRY }}/api/v1/packages/${{ env.OWNER }}/container/nexara/-/link/nexara" \
            || echo "(already linked or not available)"

      - name: Generate release notes
        id: notes
        run: |
          chmod +x scripts/generate-release-notes.sh
          NOTES=$(scripts/generate-release-notes.sh "${{ steps.version.outputs.tag }}")
          echo "$NOTES" > /tmp/release-notes.md

      - name: Create Gitea release
        run: |
          BODY=$(cat /tmp/release-notes.md)
          BODY_JSON=$(printf '%s' "$BODY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')
          # REGISTRY is a bare host — it has to be, for `docker login` and the
          # image ref — so the scheme belongs here, the way the package-link
          # step above already does it. Without it curl assumes http://, the
          # instance answers 308, and curl was not given -L so it never follows
          # and the body is dropped. Paired with `curl -s` and no status check
          # that still exited 0. v1.8.6 was the first release run to get this
          # far — v1.8.2..v1.8.5 died earlier on the stale Go toolchain (fixed
          # in dff08ea) — and it reported success while publishing nothing.
          STATUS=$(curl -sS -o /tmp/release-resp.json -w '%{http_code}' -X POST \
            "https://${{ env.REGISTRY }}/api/v1/repos/${{ env.OWNER }}/nexara/releases" \
            -H "Authorization: token ${{ secrets.REGISTRY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"tag_name\": \"${{ steps.version.outputs.tag }}\",
              \"name\": \"Nexara ${{ steps.version.outputs.tag }}\",
              \"body\": ${BODY_JSON},
              \"draft\": false,
              \"prerelease\": false
            }")
          # 409 means a release for this tag already exists, which is the
          # desired end state — keep re-runs after a flake (say, a registry 500
          # mid-job) idempotent rather than red.
          if [ "$STATUS" = "409" ]; then
            echo "Gitea release ${{ steps.version.outputs.tag }} already exists — nothing to do"
            exit 0
          fi
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Gitea release API returned HTTP $STATUS"
            cat /tmp/release-resp.json
            exit 1
          fi
          echo "Created Gitea release ${{ steps.version.outputs.tag }} (HTTP $STATUS)"
