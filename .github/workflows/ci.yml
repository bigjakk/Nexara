name: CI

on:
  # `master` rather than a glob: `*` does not match a `/`, so the old value
  # silently covered slash-free branches (`master`, `ci-verify`, `mirror-nudge`)
  # while skipping every `feat/…` and `dependabot/…` branch — coverage decided
  # by punctuation. Code reaches `master` only as a direct push or as a merged
  # PR, and the two triggers below cover both, so this is full coverage of
  # everything that lands with no branch firing both and burning two identical
  # runs. A feature-branch push with no PR open runs nothing, by design.
  #
  # If a merge queue is ever enabled here, add `merge_group:` — a queued PR
  # waits on a check that otherwise never starts, and hangs silently.
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-ci:
    # Pinned rather than ubuntu-latest, here and on every job in release.yml,
    # so the OS a build runs on changes only in a commit CI has already run on.
    # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748); this is that image, already GA.
    runs-on: ubuntu-26.04

    # The internal/db migration round-trip tests skip themselves unless
    # NEXARA_TEST_DB_URL is set, so without this service they skipped on every
    # push while the package still reported "ok". Migrations are applied
    # automatically against existing user databases on container startup, so a
    # broken one would ship unnoticed.
    #
    # This covers direct pushes to master and every PR. A v* tag does NOT run
    # this workflow — `on: push: branches` does not match a tag ref — so
    # release.yml carries its own copy of this block. Keep the two in sync;
    # dropping it there is what would let an unvalidated migration chain ship.
    #
    # TimescaleDB rather than the stock postgres image: migration 000002 runs
    # CREATE EXTENSION timescaledb, which needs the library preloaded — plain
    # postgres cannot run the chain at all.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: nexara
          POSTGRES_DB: nexara_test
        ports:
          - 5432:5432
        # -h 127.0.0.1 so the probe tests the TCP listener. The postgres
        # entrypoint runs a temporary server with listen_addresses='' while it
        # executes init scripts, and that server answers on the Unix socket —
        # so a socket-only probe can report ready before TCP is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nexara -d nexara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

      - name: Test
        # -timeout 30m overrides Go's 10m per-package default. internal/api
        # runs ~3 min under bare -race on a 12-core box (no -coverprofile here,
        # unlike `make test`); a 4-vCPU hosted runner is 1.5-2x that, and a
        # timeout surfaces as a panic that reads like a hung test rather than a
        # slow suite, so the headroom stays.
        run: go test -race -count=1 -timeout 30m ./...
        env:
          # A throwaway database: the migration tests round-trip the schema all
          # the way up and back down, so this must never address a real one.
          # Reached on localhost because GitHub runs the job on the runner VM
          # and maps the service port to it. The dormant .gitea copy addressed
          # the service by name instead — act_runner put the job in a container.
          NEXARA_TEST_DB_URL: postgres://nexara:nexara@localhost:5432/nexara_test?sslmode=disable

      - name: Build unified binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/nexara

  govulncheck:
    # Runs in the Dockerfile's go-builder image, pulled fresh as the image
    # build pulls it, so it checks the standard library the shipped binary is
    # built with. setup-go's Go is not that: it resolves go.mod's `go` line
    # from its own manifest, and both it and the golang image can trail a Go
    # patch release (v1.15.0 was built on go1.27.1 after 1.27.2 was out).
    # Dependabot reports no standard-library advisories at all.
    #
    # Exit status 3 is a reachable vulnerability. A module one is fixed by a
    # bump. A standard-library one needs a golang image carrying the fixed Go,
    # which can trail the Go release by days; docker-library publishes the
    # patch tag together with the floating one, so pinning gains nothing.
    # Wait, or move FROM to a newer minor once this one is out of support.
    #
    # release.yml carries a copy that gates the image push. Keep them in sync.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: govulncheck
        run: |
          GO_IMAGE=$(sed -n 's/^FROM \(golang:[^ ]*\) AS go-builder$/\1/p' docker/nexara/Dockerfile)
          if [ -z "$GO_IMAGE" ]; then
            echo "::error::no 'FROM golang:... AS go-builder' line in docker/nexara/Dockerfile"
            exit 1
          fi
          docker run --rm --pull=always -e CGO_ENABLED=0 \
            -v "$PWD:/src:ro" -w /src "$GO_IMAGE" \
            sh -c 'go version && go install golang.org/x/vuln/cmd/govulncheck@v1.9.0 && govulncheck ./...'

  frontend-ci:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-26.04
    needs: [go-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v7

      - name: Build unified image
        # --provenance=false mirrors release.yml, which needs it to push one
        # manifest per release; here it proves the flag on this runner's Docker.
        run: |
          docker build \
            --pull \
            --provenance=false \
            -f docker/nexara/Dockerfile \
            -t nexara:ci \
            .
