name: Release

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/nexara

permissions:
  contents: write
  packages: write

jobs:
  go-ci:
    # Pinned rather than ubuntu-latest, here and on every job in ci.yml, so the
    # OS a release builds on changes only in a commit CI has already run on.
    # ubuntu-latest moves to 26.04 between 2026-10-19 and 2026-11-19
    # (actions/runner-images#14748); this is that image, already GA.
    runs-on: ubuntu-26.04

    # Mirrors the identical block in ci.yml, and is required here rather than
    # inherited from it: ci.yml triggers on `push: branches`, which does not
    # match a tag push, and this workflow does not depend on it. Without this
    # service a `v*` tag — the entire release procedure — runs the migration
    # tests as silent skips while the package still reports "ok", satisfies
    # `needs: [go-ci, ...]`, and ships an image
    # whose migration chain then runs unvalidated against every existing user
    # database on container startup. That is the release path, so it matters
    # more here than in ci.yml.
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: nexara
          POSTGRES_PASSWORD: nexara
          POSTGRES_DB: nexara_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U nexara -d nexara_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: Test
        # -timeout 30m: see the same override in ci.yml. internal/api under
        # -race does not fit Go's 10m per-package default on a hosted runner,
        # and a release is the worst place to discover that.
        run: go test -race -count=1 -timeout 30m ./...
        env:
          NEXARA_TEST_DB_URL: postgres://nexara:nexara@localhost:5432/nexara_test?sslmode=disable

      - name: Build unified binary
        run: CGO_ENABLED=0 go build -o /dev/null ./cmd/nexara

  frontend-ci:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

  release:
    runs-on: ubuntu-26.04
    needs: [go-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          COMMIT=$(git rev-parse --short HEAD)
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "build_time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        # --provenance=false: the Docker 29 on ubuntu-26.04 uses the containerd
        # image store, where a build attaches a provenance attestation by
        # default, so the push would be an index plus two untagged manifests —
        # three GHCR versions per release — and the cleanup below, which keeps
        # three versions, would keep only one release. Without the flag Docker
        # 29 builds an OCI index; with it, a single manifest again, as Docker 28
        # built.
        run: |
          docker build \
            --pull \
            --provenance=false \
            -f docker/nexara/Dockerfile \
            --build-arg "VERSION=${{ steps.version.outputs.version }}" \
            --build-arg "COMMIT=${{ steps.version.outputs.commit }}" \
            --build-arg "BUILD_TIME=${{ steps.version.outputs.build_time }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.description=Nexara - Proxmox management platform" \
            --label "org.opencontainers.image.version=${{ steps.version.outputs.version }}" \
            -t "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            .
          docker push "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}"
          docker push "${{ env.IMAGE_NAME }}:latest"

      - name: Set package to public
        run: |
          gh api \
            --method PUT \
            /user/packages/container/nexara/visibility \
            -f visibility=public \
            2>/dev/null || echo "(skipped — may already be public or not yet created)"
        env:
          GH_TOKEN: ${{ secrets.PKG_VISIBILITY_TOKEN }}

      - name: Cleanup old package versions
        # Keeps the three newest image versions and deletes the rest, as
        # actions/delete-package-versions@v5 did with min-versions-to-keep: 3.
        # That action is frozen on Node 20 (last release v5.0.0, January 2024,
        # and its README says upstream takes no contributions), so this makes
        # the same two REST calls it made — list the versions, then delete all
        # but the newest three by created_at — with the gh and jq the runner
        # ships. It counts versions, so it is right only while each release
        # pushes exactly one manifest (see --provenance=false above).
        # The listing is read whole before anything is deleted: the API does
        # not document its order, so a listing that failed part-way could
        # leave one of the three newest versions on the delete list. A failed
        # listing or jq run ends the step (-e) having deleted nothing; a failed
        # delete is reported and the rest are still attempted, as the action
        # did, because GitHub refuses to delete a public version downloaded
        # more than 5,000 times, and that version, always the oldest, would
        # otherwise block every delete after it. continue-on-error keeps any
        # cleanup failure from failing a release whose image is already pushed.
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          versions=$(gh api --paginate "/users/${OWNER}/packages/container/nexara/versions?per_page=100")
          ids=$(jq -rs 'add | sort_by(.created_at, .id) | .[:-3] | .[].id' <<< "$versions")
          failed=0
          for id in $ids; do
            if gh api --method DELETE "/users/${OWNER}/packages/container/nexara/versions/${id}"; then
              echo "Deleted package version ${id}"
            else
              failed=1
            fi
          done
          exit "$failed"

      - name: Generate release notes
        id: notes
        run: |
          chmod +x scripts/generate-release-notes.sh
          scripts/generate-release-notes.sh "${{ steps.version.outputs.tag }}" > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Nexara ${{ steps.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
